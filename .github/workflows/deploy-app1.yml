name: Deploy App1

on:
  push:
    branches:
      - app1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH & Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 3.20.232.50
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e  # <-- stop the script if any command fails

          cd ~/app1
          git pull origin app1

          pm2 delete app1 || true  # delete if already exists
          pm2 start index.js --name app1

          # Wait a few seconds to allow app to crash if there's a syntax error
          sleep 3

          # Check if app is online
          STATUS=$(pm2 info app1 | grep status | awk '{print $4}')
          if [ "$STATUS" != "online" ]; then
            echo "❌ PM2 app1 failed to start correctly. Status: $STATUS"
            pm2 logs app1 --lines 20
            exit 1
          fi

