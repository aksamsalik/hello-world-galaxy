name: Deploy App1

on:
  push:
    branches:
      - app1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH & Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 3.20.232.50
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true  # <-- This is the key fix
        script: |
          set -e  # fail on any error
    
          cd ~/app1
          git pull origin app1
    
          pm2 delete app1 || true
          pm2 start index.js --name app1
    
          sleep 3
    
          STATUS=$(pm2 info app1 | grep status | awk '{print $4}')
          if [ "$STATUS" != "online" ]; then
            echo "❌ PM2 app1 failed to start correctly. Status: $STATUS"
            pm2 logs app1 --lines 20
            exit 1
          fi


